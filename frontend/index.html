<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짚어드림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #DFE3DC; --paper: #EEF2F0; --ink: #1E2A22; --ink-soft: #5B6B62;
    --route: #0F6E56; --route-light: #D9EBE4; --route-dark: #084234;
    --amber: #C97F1E; --amber-light: #F5E4C8; --indigo: #1B4F72; --indigo-light: #DCE6EE;
    --gray: #6B6B65; --gray-light: #E7E5DE; --card: #FFFFFF; --line: #E4E1D6;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Gowun Dodum', sans-serif; background: var(--page-bg); margin: 0; padding: 28px 16px; color: var(--ink); display: flex; justify-content: center; }
  svg.icon { display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

  .phone-frame { width: 390px; max-width: 100%; background: #0C110D; border-radius: 46px; padding: 12px; box-shadow: 0 24px 60px -24px rgba(12,17,13,0.45); }
  .phone-screen { background: var(--paper); border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; height: 800px; position: relative; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 4px; font-size: 13px; font-weight: 700; color: var(--ink); flex-shrink: 0; }
  .status-bar .status-icons { display: flex; gap: 6px; align-items: center; color: var(--ink); }

  .app-topbar { display: flex; align-items: center; gap: 10px; padding: 10px 20px 14px; flex-shrink: 0; border-bottom: 1px solid var(--line); }
  .brand-mark { width: 30px; height: 30px; flex-shrink: 0; }
  .app-topbar .name { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 19px; color: var(--ink); }
  .app-topbar .tagline { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  .screen-content { flex: 1; overflow-y: auto; padding: 18px 18px 14px; -webkit-overflow-scrolling: touch; }
  .screen-content::-webkit-scrollbar { width: 0; }

  .bottom-tabbar { display: flex; border-top: 1px solid var(--line); background: #fff; flex-shrink: 0; padding: 9px 0 12px; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #9AA79F; cursor: pointer; padding: 2px 0; font-weight: 700; }
  .tab-item.active { color: var(--route); }

  .subpage { display: none; }
  .subpage.active { display: block; opacity: 0; transform: translateY(10px); }
  .subpage.active.enter { opacity: 1; transform: translateY(0); transition: opacity .28s ease, transform .28s ease; }

  .steps-track { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .steps-track .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--route-light); }
  .steps-track .dot.done, .steps-track .dot.current { background: var(--route); }

  .card { background: var(--card); border-radius: 18px; padding: 18px; border: 1px solid var(--line); margin-bottom: 14px; }
  .card h2 { font-size: 14.5px; color: var(--ink); margin: 0 0 12px; font-weight: 700; }

  .upload-zone { border: 2px dashed #B8C4BC; border-radius: 16px; padding: 30px 16px; text-align: center; cursor: pointer; background: #F7F9F7; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .upload-zone p { font-size: 15.5px; color: var(--ink); margin: 0; font-weight: 700; }
  .upload-zone .hint { font-size: 12.5px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
  input[type=file] { display: none; }
  #preview { width: 100%; border-radius: 12px; margin-top: 10px; display: none; max-height: 220px; object-fit: contain; border: 1px solid var(--line); }

  textarea { width: 100%; font-size: 15.5px; padding: 12px; border-radius: 12px; border: 1.5px solid #D8D5C9; margin-top: 10px; font-family: inherit; resize: vertical; min-height: 50px; background: #FDFCF9; }
  button.ask { width: 100%; font-size: 17px; font-weight: 700; padding: 14px; background: var(--route); color: #fff; border: none; border-radius: 14px; margin-top: 12px; cursor: pointer; font-family: 'Gowun Dodum', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
  button.ask:disabled { background: #B7C7C0; cursor: not-allowed; }
  button.ask:active:not(:disabled) { transform: scale(0.98); }

  .info-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; padding: 6px 2px; font-weight: 700; user-select: none; }
  .info-toggle svg.icon:first-child { color: var(--route); }
  .info-toggle .chev { margin-left: auto; transition: transform .2s; }
  .info-toggle.open .chev { transform: rotate(180deg); }
  .info-panel { display: none; font-size: 13px; color: var(--ink-soft); line-height: 1.7; padding: 4px 2px 2px; }
  .info-panel.open { display: block; }
  .info-panel b { color: var(--ink); }

  .loading-page { text-align: center; padding: 90px 20px 40px; }
  .loading-ring { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 22px; border: 5px solid var(--route-light); border-top-color: var(--route); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-page p { font-size: 16px; color: var(--ink); font-weight: 700; margin: 0 0 6px; }
  .loading-page .loading-sub { font-size: 13.5px; color: var(--ink-soft); font-weight: 400; }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }
  .badge.kiosk { background: var(--amber-light); color: var(--amber); }
  .badge.app { background: var(--route-light); color: var(--route-dark); }
  .badge.gov { background: var(--indigo-light); color: var(--indigo); }
  .badge.etc { background: var(--gray-light); color: var(--gray); }

  /* 캡처 이미지 + 위치 핀 오버레이 */
  .img-wrap { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 16px; background: #fff; }
  .img-wrap img { width: 100%; display: block; }
  .pin { position: absolute; transform: translate(-50%, -100%) scale(0.7); opacity: 0; transition: opacity .3s ease, transform .3s ease; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .pin.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  .pin-badge { width: 27px; height: 27px; border-radius: 50%; background: var(--route); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; box-shadow: 0 2px 8px rgba(8,66,52,0.35); border: 2px solid #fff; }
  .pin-tail { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--route); margin-top: -2px; }
  .pin.pulse .pin-badge { animation: pinpulse 1s ease-out 1; }
  @keyframes pinpulse { 0% { box-shadow: 0 0 0 0 rgba(15,110,86,0.55); } 100% { box-shadow: 0 0 0 12px rgba(15,110,86,0); } }

  .route-list { margin: 4px 0 0; padding: 0; }
  .route-item { display: flex; gap: 14px; align-items: flex-start; position: relative; padding-bottom: 22px; opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease; }
  .route-item.show { opacity: 1; transform: translateY(0); }
  .route-item:last-child { padding-bottom: 0; }
  .route-item:not(:last-child)::before { content: ''; position: absolute; left: 14px; top: 30px; bottom: -20px; width: 2px; background: var(--route-light); }
  .route-badge { width: 29px; height: 29px; border-radius: 50%; background: var(--route); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; position: relative; z-index: 1; }
  .route-text { font-size: 16.5px; line-height: 1.65; color: var(--ink); padding-top: 3px; }

  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .speak-btn, .copy-btn { flex: 1; background: #F7F9F7; border: 1.5px solid var(--route); color: var(--route); font-size: 13.5px; font-weight: 700; padding: 10px 6px; border-radius: 12px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .restart-btn { width: 100%; background: none; border: none; color: var(--ink-soft); font-size: 14px; font-weight: 700; padding: 10px; cursor: pointer; font-family: inherit; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .error { display: none; color: #A23B2D; font-size: 13.5px; margin-top: 8px; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-chip { font-size: 12.5px; padding: 6px 12px; border-radius: 16px; border: 1.5px solid #D8D5C9; background: #fff; color: var(--ink-soft); cursor: pointer; }
  .filter-chip.active { background: var(--route); border-color: var(--route); color: #fff; }

  .hist-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .hist-item:last-child { border-bottom: none; }
  .hist-icon { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .hist-icon.kiosk { background: var(--amber-light); color: var(--amber); }
  .hist-icon.app { background: var(--route-light); color: var(--route-dark); }
  .hist-icon.gov { background: var(--indigo-light); color: var(--indigo); }
  .hist-icon.etc { background: var(--gray-light); color: var(--gray); }
  .hist-body { flex: 1; min-width: 0; }
  .hist-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .hist-q { font-size: 14.5px; color: var(--ink); margin: 0 0 4px; font-weight: 700; }
  .hist-a { font-size: 13px; color: var(--ink-soft); line-height: 1.55; }
  .hist-time { font-size: 11.5px; color: #A5A59C; margin-top: 4px; }
  .del-btn { background: none; border: none; color: #C9BEB6; cursor: pointer; padding: 2px; flex-shrink: 0; }
  .empty-hist { text-align: center; color: var(--ink-soft); font-size: 14.5px; padding: 40px 10px; line-height: 1.7; }
  .empty-hist svg.icon { color: var(--route-light); display: block; margin: 0 auto 10px; }

  .shared-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; background: #F7F9F7; padding: 8px 10px; border-radius: 10px; }
  .shared-note svg.icon { color: var(--route); }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">

    <div class="status-bar">
      <span id="clockNow">9:41</span>
      <span class="status-icons" id="statusIcons"></span>
    </div>

    <div class="app-topbar">
      <svg class="brand-mark" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="16" fill="#0F6E56"/>
        <path d="M9 20 Q16 8 24 19" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="24" cy="19" r="2.8" fill="#fff"/>
      </svg>
      <div>
        <div class="name">짚어드림</div>
        <div class="tagline">화면이 막히면, 제가 짚어드릴게요</div>
      </div>
    </div>

    <div class="screen-content">

      <div class="page active" id="pageHome">

        <div class="subpage active enter" id="subIntro">
          <div class="steps-track"><div class="dot current"></div><div class="dot"></div><div class="dot"></div></div>

          <div class="card">
            <div class="upload-zone" id="uploadZone"></div>
            <input type="file" id="fileInput" accept="image/*" capture="environment">
            <img id="preview">
            <textarea id="question" placeholder="예: 지하철 표를 사고 싶은데 어떻게 눌러야 하나요?"></textarea>
            <button class="ask" id="askBtn" disabled></button>
            <div class="error" id="errorBox"></div>
          </div>

          <div class="info-toggle" id="infoToggle"></div>
          <div class="info-panel" id="infoPanel">
            사진을 올리면 <b>① AI가 화면을 인식</b>하고, <b>② 키오스크·앱·공공서비스 중 어떤 화면인지 자동으로 분류</b>한 뒤, <b>③ 캡처 화면 위에 번호 핀으로 위치를 짚어주며 순서대로 안내</b>해줘요.
          </div>
        </div>

        <div class="subpage" id="subLoading">
          <div class="steps-track"><div class="dot done"></div><div class="dot current"></div><div class="dot"></div></div>
          <div class="loading-page">
            <div class="loading-ring"></div>
            <p>화면을 살펴보고 있어요</p>
            <div class="loading-sub">잠시만 기다려주세요...</div>
          </div>
        </div>

        <div class="subpage" id="subResult">
          <div class="steps-track"><div class="dot done"></div><div class="dot done"></div><div class="dot current"></div></div>
          <div class="card">
            <div id="badgeBox"></div>
            <div class="img-wrap" id="imgWrap">
              <img id="resultImg">
            </div>
            <div class="route-list" id="resultSteps"></div>
            <div class="btn-row">
              <button class="speak-btn" id="speakBtn"></button>
              <button class="copy-btn" id="copyBtn"></button>
            </div>
          </div>
          <button class="restart-btn" id="restartBtn"></button>
        </div>
      </div>

      <div class="page" id="pageHistory">
        <div class="card">
          <div class="shared-note" id="sharedNote"></div>
          <h2>지난 질문 모아보기</h2>
          <div class="filter-row" id="filterRow">
            <div class="filter-chip active" data-filter="전체">전체</div>
            <div class="filter-chip" data-filter="키오스크">키오스크</div>
            <div class="filter-chip" data-filter="모바일 앱">모바일 앱</div>
            <div class="filter-chip" data-filter="공공서비스">공공서비스</div>
            <div class="filter-chip" data-filter="기타">기타</div>
          </div>
          <div id="histList"></div>
        </div>
      </div>

    </div>

    <div class="bottom-tabbar">
      <div class="tab-item active" id="tabHome"></div>
      <div class="tab-item" id="tabHistory"></div>
    </div>

  </div>
</div>

<script>
const ICON_PATHS = {
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  sparkles: '<path fill="currentColor" stroke="none" d="M12 2l1.7 4.6L18 8l-4.3 1.6L12 14l-1.7-4.4L6 8l4.3-1.4z"/><path fill="currentColor" stroke="none" d="M19 13l.9 2.3L22 16l-2.1.8L19 19l-.9-2.2L16 16l2.1-.7z"/>',
  volume: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 0 1 0 8"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  restart: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',
  home: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  history: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M4.5 6.5L3.5 3.5"/>',
  trash: '<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
  chevronDown: '<path d="M6 9l6 6 6-6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>',
  check: '<path d="M4 12l5 5 11-11"/>',
  x: '<path d="M5 5l14 14M19 5L5 19"/>',
  desktop: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>',
  mobile: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.3 9a2.7 2.7 0 0 1 5.2.9c0 1.6-2.2 2-2.5 3.6"/><path d="M12 17h.01"/>',
  wifi: '<path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5.5 12a11 11 0 0 1 13 0"/><path d="M9 15.5a6 6 0 0 1 6 0"/><path d="M12 19h.01"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="9" r="2.5"/><path d="M15.5 14.2c2.3.4 4 2.3 4.5 4.8"/>'
};
function icon(name, size) {
  const body = ICON_PATHS[name] || '';
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
function signalBars() {
  return `<svg class="icon" width="16" height="14" viewBox="0 0 20 16" fill="currentColor"><rect x="0" y="10" width="3" height="6" rx="0.5"/><rect x="5.5" y="7" width="3" height="9" rx="0.5"/><rect x="11" y="4" width="3" height="12" rx="0.5"/><rect x="16.5" y="0" width="3" height="16" rx="0.5"/></svg>`;
}
function batteryIcon() {
  return `<svg class="icon" width="22" height="12" viewBox="0 0 24 13" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="19" height="11" rx="2.5"/><rect x="22" y="4.5" width="1.5" height="4" fill="currentColor" stroke="none"/><rect x="3" y="3" width="14" height="7" rx="1" fill="currentColor" stroke="none"/></svg>`;
}

// ⚠️ Render에 백엔드를 배포한 뒤, 아래 주소를 발급받은 실제 주소로 바꿔주세요.
// 예: "https://jipeodeurim-backend.onrender.com"
const BACKEND_URL = "https://jipeodeurim-backend.onrender.com";

const $ = id => document.getElementById(id);

$('statusIcons').innerHTML = signalBars() + icon('wifi', 15) + batteryIcon();
$('uploadZone').innerHTML = '<span style="color:var(--route)">' + icon('camera', 28) + '</span><p>화면을 캡처해서 올려주세요</p><div class="hint">키오스크, 앱, 공공서비스 화면 무엇이든 좋아요</div>';
$('askBtn').innerHTML = icon('sparkles', 18) + '이 화면 설명해주세요';
$('infoToggle').innerHTML = icon('info', 15) + '<span>이 앱은 어떻게 작동하나요?</span>' + `<span class="chev">${icon('chevronDown', 15)}</span>`;
$('speakBtn').innerHTML = icon('volume', 17) + '소리로 듣기';
$('copyBtn').innerHTML = icon('copy', 17) + '결과 복사';
$('restartBtn').innerHTML = icon('restart', 17) + '처음으로 돌아가기';
$('sharedNote').innerHTML = icon('users', 15) + '이 기록은 팀원 전체가 함께 보는 공유 기록이에요';
$('tabHome').innerHTML = icon('home', 21) + '홈';
$('tabHistory').innerHTML = icon('history', 21) + '히스토리';

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  $('clockNow').textContent = `${h}:${m}`;
}
updateClock();
setInterval(updateClock, 15000);

const tabHome = $('tabHome'), tabHistory = $('tabHistory');
const pageHome = $('pageHome'), pageHistory = $('pageHistory');
const subIntro = $('subIntro'), subLoading = $('subLoading'), subResult = $('subResult');
const uploadZone = $('uploadZone'), fileInput = $('fileInput'), preview = $('preview');
const askBtn = $('askBtn'), questionEl = $('question');
const badgeBox = $('badgeBox'), resultSteps = $('resultSteps');
const imgWrap = $('imgWrap'), resultImg = $('resultImg');
const speakBtn = $('speakBtn'), copyBtn = $('copyBtn'), errorBox = $('errorBox');
const restartBtn = $('restartBtn');
const infoToggle = $('infoToggle'), infoPanel = $('infoPanel');
const filterRow = $('filterRow'), histList = $('histList');

let imageBase64 = null, imageMediaType = null, imageDataUrl = null;
let currentFilter = '전체';
let lastAnswerText = '';

tabHome.addEventListener('click', () => switchTab('home'));
tabHistory.addEventListener('click', () => switchTab('history'));
function switchTab(name) {
  tabHome.classList.toggle('active', name === 'home');
  tabHistory.classList.toggle('active', name === 'history');
  pageHome.classList.toggle('active', name === 'home');
  pageHistory.classList.toggle('active', name === 'history');
  if (name === 'history') renderHistory();
}

infoToggle.addEventListener('click', () => {
  infoToggle.classList.toggle('open');
  infoPanel.classList.toggle('open');
});

function showSubpage(name) {
  [subIntro, subLoading, subResult].forEach(el => el.classList.remove('active', 'enter'));
  const map = { intro: subIntro, loading: subLoading, result: subResult };
  const el = map[name];
  el.classList.add('active');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('enter')));
}

function resetToIntro() {
  showSubpage('intro');
  preview.style.display = 'none'; preview.src = '';
  questionEl.value = ''; askBtn.disabled = true;
  errorBox.style.display = 'none';
  imageBase64 = null; imageMediaType = null; imageDataUrl = null;
}
restartBtn.addEventListener('click', resetToIntro);

function setImageFromDataUrl(dataUrl, mediaType) {
  imageBase64 = dataUrl.split(',')[1];
  imageMediaType = mediaType;
  imageDataUrl = dataUrl;
  preview.src = dataUrl; preview.style.display = 'block';
  askBtn.disabled = false; errorBox.style.display = 'none';
}

uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => setImageFromDataUrl(e.target.result, file.type);
  reader.readAsDataURL(file);
});

const BADGE_MAP = {
  '키오스크': ['kiosk', 'desktop', '키오스크'],
  '모바일 앱': ['app', 'mobile', '모바일 앱'],
  '공공서비스': ['gov', 'bank', '공공서비스'],
  '기타': ['etc', 'help', '기타']
};
function badgeFor(type) {
  const [cls, iconName, label] = BADGE_MAP[type] || BADGE_MAP['기타'];
  const iconMap = { desktop: ICON_PATHS.desktop, mobile: ICON_PATHS.mobile, bank: '<path d="M3 10l9-6 9 6"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9"/><path d="M3 21h18"/>', help: ICON_PATHS.help };
  const svg = `<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconMap[iconName]}</svg>`;
  return [cls, `<span class="badge ${cls}">${svg}${label}</span>`];
}

async function callBackend(base64, mediaType, question) {
  const response = await fetch(`${BACKEND_URL}/api/analyze`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64, media_type: mediaType, question })
  });
  if (!response.ok) {
    const errData = await response.json().catch(() => ({}));
    throw new Error(errData.detail || '요청 실패');
  }
  return response.json();
}

function normalizeSteps(rawSteps) {
  if (!Array.isArray(rawSteps)) return [{ text: String(rawSteps || '안내를 가져오지 못했어요.'), x: 50, y: 50 }];
  return rawSteps.map(s => {
    if (typeof s === 'string') return { text: s, x: 50, y: 50 };
    return { text: s.text || '안내를 가져오지 못했어요.', x: Number.isFinite(s.x) ? s.x : 50, y: Number.isFinite(s.y) ? s.y : 50 };
  });
}

function renderResultEmpty(steps) {
  const pinsHtml = steps.map((s, i) => `
    <div class="pin" data-i="${i}" style="left:${s.x}%; top:${s.y}%;">
      <div class="pin-badge">${i+1}</div>
      <div class="pin-tail"></div>
    </div>
  `).join('');
  imgWrap.innerHTML = '<img id="resultImg" src="' + imageDataUrl + '">' + pinsHtml;

  resultSteps.innerHTML = steps.map((s, i) => `
    <div class="route-item" data-i="${i}">
      <div class="route-badge">${i+1}</div>
      <div class="route-text">${s.text}</div>
    </div>
  `).join('');
}

function revealStepsSequentially() {
  const items = resultSteps.querySelectorAll('.route-item');
  const pins = imgWrap.querySelectorAll('.pin');
  items.forEach((el, i) => setTimeout(() => {
    el.classList.add('show');
    const pin = pins[i];
    if (pin) {
      pin.classList.add('show', 'pulse');
      setTimeout(() => pin.classList.remove('pulse'), 1000);
    }
  }, i * 650));
}

function showResult(screenType, steps, ttsText) {
  const [, badgeHtml] = badgeFor(screenType);
  badgeBox.innerHTML = badgeHtml;
  renderResultEmpty(steps);
  lastAnswerText = steps.map((s,i) => `${i+1}. ${s.text}`).join('\n');
  speakBtn.dataset.tts = ttsText;
  showSubpage('result');
  revealStepsSequentially();
}

async function runAnalysis(base64, mediaType, question) {
  showSubpage('loading');
  try {
    const result = await callBackend(base64, mediaType, question);
    const screenType = result.screen_type || '기타';
    const steps = normalizeSteps(result.steps);
    const ttsText = result.tts_text || steps.map(s => s.text).join(' ');
    showResult(screenType, steps, ttsText);
    // 히스토리는 백엔드 /api/analyze 호출 시 서버 DB에 자동 저장됩니다.
  } catch (err) {
    showSubpage('intro');
    errorBox.textContent = '문제가 발생했어요. 잠시 후 다시 시도해주세요.';
    errorBox.style.display = 'block';
  }
}

askBtn.addEventListener('click', () => {
  if (!imageBase64) return;
  const userQuestion = questionEl.value.trim() || '이 화면에서 무엇을 눌러야 하는지 알려주세요.';
  runAnalysis(imageBase64, imageMediaType, userQuestion);
});

speakBtn.addEventListener('click', () => {
  const text = speakBtn.dataset.tts || lastAnswerText;
  if (!text) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR'; utter.rate = 0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(utter);
});

copyBtn.addEventListener('click', async () => {
  if (!lastAnswerText) return;
  const original = copyBtn.innerHTML;
  try {
    await navigator.clipboard.writeText(lastAnswerText);
    copyBtn.innerHTML = icon('check', 17) + '복사됨';
    setTimeout(() => copyBtn.innerHTML = original, 1500);
  } catch {
    copyBtn.innerHTML = icon('x', 17) + '복사 실패';
    setTimeout(() => copyBtn.innerHTML = original, 1500);
  }
});

async function deleteHistoryRecord(id) {
  try { await fetch(`${BACKEND_URL}/api/history/${id}`, { method: 'DELETE' }); } catch (e) {}
  renderHistory();
}

filterRow.addEventListener('click', (e) => {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  [...filterRow.children].forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  renderHistory();
});

async function renderHistory() {
  histList.innerHTML = '<p class="empty-hist">불러오는 중...</p>';
  let list = [];
  try {
    const url = currentFilter === '전체'
      ? `${BACKEND_URL}/api/history`
      : `${BACKEND_URL}/api/history?screen_type=${encodeURIComponent(currentFilter)}`;
    const res = await fetch(url);
    if (res.ok) list = await res.json();
  } catch (e) {}

  if (list.length === 0) {
    histList.innerHTML = `<p class="empty-hist">${icon('history', 32)}아직 기록이 없어요.<br>홈에서 화면을 물어보면 여기 쌓여요.</p>`;
    return;
  }

  histList.innerHTML = list.map(r => {
    const [cls] = badgeFor(r.screen_type);
    const iconMap = { kiosk: ICON_PATHS.desktop, mobile: ICON_PATHS.mobile, app: ICON_PATHS.mobile, gov: '<path d="M3 10l9-6 9 6"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9"/><path d="M3 21h18"/>', etc: ICON_PATHS.help };
    const svg = `<svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconMap[cls]}</svg>`;
    const stepsText = (r.steps || []).map(s => typeof s === 'string' ? s : s.text).join(' → ');
    return `
    <div class="hist-item">
      <div class="hist-icon ${cls}">${svg}</div>
      <div class="hist-body">
        <div class="hist-top">
          <div class="hist-q">${r.question}</div>
          <button class="del-btn" data-id="${r.id}">${icon('trash', 16)}</button>
        </div>
        <div class="hist-a">${stepsText}</div>
        <div class="hist-time">${r.timestamp}</div>
      </div>
    </div>
  `;
  }).join('');

  histList.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteHistoryRecord(btn.dataset.id));
  });
}

</script>
</body>
</html>
